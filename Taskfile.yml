version: "3"

env:
  PATH:
    sh: echo "$(go env GOPATH)/bin:$HOME/go/bin:$PATH"

vars:
  BINARY_NAME: "server{{exeExt}}"
  BIN_PATH: "bin/{{.BINARY_NAME}}"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install and tidy Go module dependencies
    cmds:
      - go mod download
      - go mod tidy

  fix:
    desc: Apply go fix modernizers across all packages
    cmds:
      - go fix ./...

  fmt:
    desc: Format, vet, and check Go code
    cmds:
      - go fmt ./...
      - gofmt -w -s .
      - go vet ./...

  test:
    desc: Run the complete test suite
    cmds:
      - go test -v -timeout 120s ./...

  build:
    desc: "Build stripped, optimized binary executable into {{.BIN_PATH}}"
    cmds:
      - cmd: mkdir -p bin
        platforms: [linux, darwin, windows]
      - go build -trimpath -ldflags="-s -w -buildid=" -v -o {{.BIN_PATH}} ./cmd/server

  docker:build:
    desc: Build production Docker image
    cmds:
      - docker build -t thruqe/whatsapp-games:latest .

  docker:run:
    desc: Run server container exposing port 8088
    cmds:
      - docker run -it --rm -p 8088:8088 thruqe/whatsapp-games:latest

  clean:
    desc: Remove build artifacts and temporary files
    cmds:
      - cmd: rm -rf bin/ tmp/
        platforms: [linux, darwin]
      - cmd: powershell -Command "if (Test-Path bin) { Remove-Item -Recurse -Force bin }; if (Test-Path tmp) { Remove-Item -Recurse -Force tmp }"
        platforms: [windows]
